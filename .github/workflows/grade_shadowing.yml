name: Grade Shadowing Pipeline
run-name: Shadowing grading enabled=${{ vars.GRADING_ENABLED }} mode=${{ inputs.mode || 'grade' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate, read private queues, or grade eligible submissions
        type: choice
        options: [validate, audit, grade, repair-scores]
        default: grade
      repair_ids:
        description: Saved job IDs to repair without calling Gemini
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: shadowing-single-writer
  cancel-in-progress: false
jobs:
  grade:
    if: github.repository == 'mstrangtrieueducation-droid/shadowing-grader-runner' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.mode == 'validate' || inputs.mode == 'audit' || vars.GRADING_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      MODE: ${{ inputs.mode || 'grade' }}
      REPAIR_IDS: ${{ inputs.repair_ids || '' }}
      GRADING_ENABLED: ${{ vars.GRADING_ENABLED }}
      RUNNER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Validate without access to credentials
        if: env.MODE == 'validate'
        run: node run-lane.mjs
      - name: Install official media tools
        if: env.MODE != 'validate' && env.MODE != 'repair-scores'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet -r requirements.txt
      - name: Validate, audit or grade this lane
        env:
          GEMINI_KEY_SHADOWING: ${{ secrets.GEMINI_KEY_SHADOWING }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PRIVATE_BUNDLE_KEY: ${{ secrets.PRIVATE_BUNDLE_KEY }}
        run: node run-lane.mjs
